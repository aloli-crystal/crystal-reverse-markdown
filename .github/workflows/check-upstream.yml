name: Check upstream reverse_markdown

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check latest reverse_markdown version on RubyGems
        run: |
          UPSTREAM_VERSION=$(curl -s https://rubygems.org/api/v1/gems/reverse_markdown.json | jq -r '.version')
          CURRENT_VERSION="3.0.2"

          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Current tracked version: $CURRENT_VERSION"

          if [ "$UPSTREAM_VERSION" != "$CURRENT_VERSION" ]; then
            echo "::warning::reverse_markdown has a new version: $UPSTREAM_VERSION (we track $CURRENT_VERSION)"
            echo "NEW_VERSION=$UPSTREAM_VERSION" >> $GITHUB_ENV
            echo "HAS_UPDATE=true" >> $GITHUB_ENV
          else
            echo "Up to date."
            echo "HAS_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: Create issue if new version
        if: env.HAS_UPDATE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.NEW_VERSION;
            const title = `Upstream reverse_markdown ${version} released`;
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream'
            });
            const alreadyExists = existingIssues.data.some(i => i.title.includes(version));
            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `A new version of the [reverse_markdown](https://rubygems.org/gems/reverse_markdown) Ruby gem (${version}) has been released.\n\nReview the changes and update crystal-reverse-markdown accordingly.`,
                labels: ['upstream']
              });
            }
